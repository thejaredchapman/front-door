<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Front Door README banner</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600..800&family=Nunito:wght@500..800&display=swap" rel="stylesheet" />
<style>
  /* 1280×400 README banner. Render with: npm run banner */
  html,body{margin:0;width:1280px;height:400px;overflow:hidden}
  body{font-family:Nunito,sans-serif;color:#002f6c;position:relative;background:#eef8fc;
    background-image:radial-gradient(circle,rgb(0 153 204/.14) 2.5px,transparent 3px),radial-gradient(circle,rgb(196 214 0/.28) 2.5px,transparent 3px),
      radial-gradient(circle at 0% 0%,#fff4c2 0,transparent 45%),radial-gradient(circle at 100% 100%,#d4eef9 0,transparent 50%);
    background-size:48px 48px,48px 48px,auto,auto;background-position:0 0,24px 24px,0 0,0 0}
  .wrap{position:absolute;inset:0;display:grid;grid-template-columns:300px 1fr;align-items:center;padding:0 64px 0 56px;gap:28px}
  h1{font-family:"Baloo 2",sans-serif;font-size:104px;line-height:.9;margin:0;letter-spacing:-.01em}
  .tag{font-family:"Baloo 2",sans-serif;font-size:40px;font-weight:700;margin:6px 0 0;line-height:1.1}
  .tag em{font-style:normal;color:#0099cc;background:linear-gradient(transparent 62%,#f1f7a8 62%)}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .chips span{font-weight:800;font-size:17px;padding:6px 16px;border-radius:999px;background:#fff;border:3px solid #d6eaf4;box-shadow:0 4px 0 #d6eaf4}
  .chips span.hot{background:#c4d600;border-color:#a9b800;box-shadow:0 4px 0 #8f9c00}
  .bubble{position:absolute;top:18px;left:196px;background:#fff;border:3px solid #002f6c;border-radius:18px;padding:6px 14px;font-weight:800;font-size:17px;box-shadow:0 4px 0 #002f6c}
  .stripe{position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(90deg,#0099cc 0 25%,#c4d600 25% 50%,#e55d25 50% 75%,#ffd100 75%)}
  .kicker{display:inline-block;font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#007399;background:#f1f7cc;padding:5px 14px;border-radius:999px;margin-bottom:10px}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="doorie">
    <ellipse cx="80" cy="150" rx="44" ry="6" fill="#002f6c" opacity=".12"/>
    <rect x="34" y="66" width="92" height="78" rx="22" fill="#fff" stroke="#002f6c" stroke-width="4"/>
    <path d="M22 74 80 26l58 48Z" fill="#0099cc" stroke="#002f6c" stroke-width="4" stroke-linejoin="round"/>
    <rect x="104" y="36" width="12" height="20" rx="3" fill="#0099cc" stroke="#002f6c" stroke-width="4"/>
    <path d="M68 144v-26a12 12 0 0 1 24 0v26Z" fill="#c4d600" stroke="#002f6c" stroke-width="4"/>
    <ellipse cx="64" cy="84" rx="5" ry="6" fill="#002f6c"/><ellipse cx="96" cy="84" rx="5" ry="6" fill="#002f6c"/>
    <path d="M68 92q12 13 24 0Z" fill="#e55d25" stroke="#002f6c" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="52" cy="95" rx="7" ry="4.5" fill="#e55d25" opacity=".45"/><ellipse cx="108" cy="95" rx="7" ry="4.5" fill="#e55d25" opacity=".45"/>
    <path d="M126 98q14 -10 14 -30M34 98q-14 -10 -14 -30" fill="none" stroke="#002f6c" stroke-width="5" stroke-linecap="round"/>
    <path d="M18 34l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z M144 22l2 5 5 2-5 2-2 5-2-5-5-2 5-2Z M140 120l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5Z" fill="#ffd100" stroke="#002f6c" stroke-width="2"/>
  </g>
</defs></svg>
<div class="wrap">
  <svg viewBox="0 0 160 160" width="290" height="290" aria-label="Doorie, a smiling little house"><use href="#doorie"/></svg>
  <div>
    <span class="kicker">Orange County · Habitat for Humanity hackathon</span>
    <h1>Front Door</h1>
    <p class="tag">Hi! Let's find <em>a home you can afford.</em></p>
    <div class="chips"><span class="hot">Free · No sign-up</span><span>Down payment help</span><span>Home goal &amp; ready-by date</span><span>Live lender rates</span><span>6 languages</span></div>
  </div>
</div>
<div class="bubble">Hi, I'm Doorie! 👋</div>
<div class="stripe"></div>
</body></html>
